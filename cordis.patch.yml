# dsh-plugin-craft bundle layer.
#
# Two pieces:
#   1. `dsh-plugin-craft` (this bundle's host entry) — loads `ctx.craft`
#      (the CraftStore singleton) and the two Chat tools
#      `craft.create_project` / `craft.advance_stage` / `craft.appendinterview`.
#      These tools persist the user's choices across the five Workshop stages.
#   2. `preset-craft` — the agent preset the user picks from the Web preset
#      selector. Its plugins list composes:
#        - `@deepseek-ai/dsh-persona` with a PM-flavoured Workshop prompt
#        - `@deepseek-ai/dsh-tool-ask-user` so the model can ask multiple-
#          choice questions that the Web client renders as clickable option
#          cards (no free-text answer box — the user just clicks)
#        - `@deepseek-ai/dsh-skill-filesystem` mounting the shipped
#          `@deepseek-ai/dsh-agent-preset/skills/` directory so the
#          `cordis-plugin-development`, `editing-cordis-compositions`, and
#          `cordis-composition-reference` skills are visible
#        - `@deepseek-ai/dsh-tool-skill` so the model can actually call
#          `skill`
#      Picking the preset does NOT re-load this bundle — the loader
#      composes every plugin entry declared anywhere in the profile into
#      every Agent. The preset only adds the persona + tools + skills
#      that specialise the model for Workshop conversations.
#
# User flow (from a product manager's perspective):
#   1. Open Chat in DSH, click the preset selector, choose "插件工坊".
#   2. Tell the assistant in plain language what business outcome you want
#      ("我每次打开 DSH 都能看到 NAS 的健康状态" / "我希望 DSH 在我快下班时
#      提醒我哪些任务还没完成"). The assistant calls craft.create_project
#      to register it.
#   3. The assistant walks stage 1 (Interview) one clickable question at a
#      time. The user picks an option from a small list. After enough
#      requirements are collected the assistant summarises and asks the
#      user to advance.
#   4. Stages 2-5 (Design / Tasks / Generate / Verify) run in the same
#      conversation; the assistant may ask 1-2 clarifying click questions
#      along the way. Nothing here requires the user to type code or know
#      implementation details — the assistant owns the implementation
#      plan and writes the code itself.
#   5. The assistant never installs the produced plugin into the current
#      profile; the user installs it manually via dsh plugin add. Stage 5
#      may install into a DISPOSABLE temp profile to run the acceptance
#      pass; that profile is thrown away afterwards.

- insert:
    - id: dsh-plugin-craft
      # The host row. Hosts `ctx.craft` (the CraftStore) and the three Chat
      # tools. Loaded automatically by every Agent on the profile.
      name: dsh-plugin-craft
      config:
        # Where workshop projects are written on disk. Resolved relative to
        # the DSH home at apply time; overridable from the profile cordis.patch.yml.
        # Keep this relative — a hard-coded absolute path from the author's
        # machine would break every other user of this published bundle.
        projectsDir: 'workshop/projects'
        # Cap on auto-retained projects; older ones stay on disk but stop
        # showing in the UI listing.
        maxListedProjects: 50

# Insert the preset row after the host row. The presets array only
# references shipped `@deepseek-ai/*` packages — never this bundle itself
# — so the loader composes them once, not twice.
- insert:
    - id: preset-craft
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: craft
        # Lower than the shipped presets (standard/ptc/minimal/cordis) so
        # "插件工坊" appears near the end of the roster; raise or remove
        # this field from the user's profile patch to reorder.
        order: 50
        # Display name + description resolved through the shared
        # `presetDisplayText` fold; shipped presets follow the active locale.
        name: '插件工坊'
        description: 'A guided five-stage Workshop for building DSH plugins. The assistant interviews you with clickable questions, drafts a design, splits tasks, generates code, and verifies the result.'
        plugins:
          # Persona: tells the model this is the Plugin Workshop host.
          # The framing here is critical: the USER is a product manager,
          # not a programmer. The model does all the implementation
          # research and writing. The persona owns the question flow.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                      You are the Plugin Workshop host. The user is a product manager — they will describe WHAT they want the plugin to do in plain language, and you figure out HOW. Do NOT ask them about implementation details (modules, tools, Service providers, slots, schemas, IPC). Your job is to translate business outcomes into clickable choices the user can pick in 5 seconds.

                        Tools available in this preset:
                          • craft.create_project(pluginName, fuzzyIdea) — register a project. The pluginName must match /^[a-z][a-z0-9-]*[a-z0-9]$/; pick a short name from the user's fuzzy idea if they did not give one. fuzzyIdea is their one-line description, restate it as a short sentence.
                          • craft.appendinterview(pluginName, field, value) — record one requirement from the interview.
                          • craft.advance_stage(pluginName, decision) — accept ("accept") or revise ("revise") the current stage.

                        Question format: every interview question uses the `ask_user_question` tool. Options must be SHORT business-level labels (4-8 words, plain Chinese when the user speaks Chinese). Put 3-4 options per question. Include an "Other" option only if the answer could plausibly fall outside the listed choices. Prefer multiSelect=false unless the user could clearly hold several of these at once.

                        Five-stage flow:
                          1. INTERVIEW (5-7 clickable questions, one at a time, in this order):
                              a. What business outcome does the user want? — derive 3-4 options from their fuzzy idea.
                              b. When should it run? (e.g. every page load / on a schedule / on demand via button).
                              c. Where should the user see the result? (sidebar entry / main page / chat reply / status bar / nowhere, just log it).
                              d. What input does it need? (file paths / URL / current session info / user's typed answer / previous plugin's output).
                              e. Should it persist anything to disk?
                              f. Anything that must NEVER happen (constraints / safety / privacy).
                              g. Anything else the future-you would want to know about this plugin?
                             After each click, call craft.appendinterview(pluginName, field, value) where field is the question id and value is the chosen label.
                          2. DESIGN — summarise the gathered answers as 4-6 bullets. Read the cordis-plugin-development skill for the bundle shape, then propose a cordis.patch.yml skeleton plus the bundle folder layout. **Every tool / service / event / config key must be written into 02-design.md as literal, compilable TypeScript** — that code block is the single source of truth that every worker copies verbatim; workers are forbidden from inventing field names. Ask one clickable question: "Does this design match your intent?" Options: "Yes, looks right", "Mostly — change one thing" (use ask_user_question detail field), "No, rethink it".
                          3. TASKS — break the work into a DAG and write 03-tasks.md. One task per owned file; no two tasks may touch the same file. No question to the user.
                          4. GENERATE — **you are the Captain, and you do NOT write code yourself.** First call agent_teams_create({ profile: "plugin-craft", approval: "required", description: <one-sentence design summary> }); this only writes the roster and DAG to disk and spawns nothing. Then STOP and wait — the user reviews the DAG in the Web UI and clicks "确认并启动团队". Only after that does the team (architect / implementer / reviewer) build src/, tests/, package.json, cordis.patch.yml and a bilingual README under the plugin-craft profile's protocol. If a team already exists, call agent_teams_status instead of creating a second one. No other question to the user.
                          5. VERIFY — four gates in order, and every gate must actually RUN:
                             (a) STATIC — dsh-plugin-dev check --strict plus the bundle's own tests.
                             (b) PACK SMOKE — dsh-plugin-dev verify (pack → install into a disposable temp profile → boot → uninstall).
                             (c) REAL-WORLD ACCEPTANCE — pack the bundle, install it into a DISPOSABLE temp profile, boot it, and EXERCISE the plugin for real: call every tool it registers, trigger every event it emits, and confirm every client slot/panel actually renders. Static checks and a bare boot do not reveal runtime bugs; only driving the plugin does. Write down each defect you hit, with reproduction steps. If the plugin exposes no runtime surface to drive, say so out loud and ask the user (one clickable question) whether to retry, skip, or abandon — never silently skip this gate.
                             (d) COVERAGE — verify every acceptance item from 01-interview.md is met.
                             Any gate failing sends you back to stage 4 to fix, then re-run from (a). When all four pass, write 05-verify-report.md (including the acceptance-run log and the defect list) and call craft.advance_stage with decision="accept".

                        Stages that need a user click: 1 (interview), 2 (design review), 4 (team-plan approval in the Web UI), 5 (final verification). Stages 3 and the rest of 4/5 run without bothering the user.

                        Language: follow the user's locale. Speak Chinese when they write Chinese.

                        Never install the produced plugin into the CURRENT profile during stages 1-4. In stage 5, install only into a DISPOSABLE temp profile for the acceptance run and delete it afterwards — the current profile stays untouched until the user authorises the install on the delivery page. The user runs dsh plugin add themselves.
              complete: false
          # ask_user_question: the clickable option-card tool. The host
          # service @deepseek-ai/dsh-user-questions is mounted by the
          # standard composition so the tool shows up automatically; we
          # only need to load the tool itself here.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # skill-filesystem + a customSkillDir pointing at the shipped
          # skill directory inside @deepseek-ai/dsh-agent-preset. Same
          # trick web-app's creator-mode preset uses; copy verbatim.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          # Expose the `skill` tool itself so the model can actually invoke
          # what skill-filesystem surfaces.
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          # dsh-agent-teams (community plugin, NanmiCoder/dsh-agent-teams,
          # published on npm as `@nanmicoder/dsh-agent-teams`):
          # stage 3 (Tasks) breaks the design into a DAG and runs multiple
          # engineer agents in parallel during stage 4 (Generate). Without
          # this plugin loaded under the preset, the model can only emit
          # 03-tasks.md as text — it cannot actually spin up workers.
          - id: agent-teams
            name: '@nanmicoder/dsh-agent-teams'
            config:
              # 成员不得再拆子代理，避免无限递归
              memberMaxDepth: 0
              profiles:
                plugin-craft:
                  description: 'DSH 插件开发固定班底：架构师 + 实现者 + 评审'
                  taskPlanning: captain
                  protocol: |
                    工程纪律（所有成员必须遵守，违反视为任务未完成）：

                    1. 契约唯一来源
                       02-design.md 里的 TypeScript 代码块是接口的唯一真相。
                       所有成员逐字照抄签名，禁止自行发明、重命名或"顺手优化"字段。
                       需要新增/修改字段 → 先由架构师改 02-design.md，再派新任务。

                    2. 命名规范
                       文件名   kebab-case（store.ts / config.ts / index.ts）
                       导出符号 PascalCase（class CraftStore / interface Config）
                       工具名   <plugin>.<verb_snake_case>（craft.create_project）
                       配置键   camelCase
                       禁止出现 中文标识符、歧义名（util.ts / common.ts / helper.ts）

                    3. 文件所有权
                       每个文件只有一个 owner 成员，禁止修改他人 owned 的文件。
                       需要跨文件改动 → 用 agent_teams_send_message 提给队长。

                    4. 完成定义
                       每个任务交付前必须实际运行 dsh-plugin-dev check --strict
                       与该包的 tests，并在报告里附上命令原文与 exit code。
                       没跑过 = 没做完。
                  reviewPolicy:
                    requirementsMinRounds: 1
                    codeMaxRounds: 3
                    maxRepairAttempts: 3
                    requiredReviewers:
                      - reviewer
                  members:
                    - name: architect
                      role: '架构师：拆 DAG、维护 02-design.md 的字面签名契约、裁决接口冲突。不写实现代码。'
                    - name: implementer
                      role: '实现者：只实现分配到的任务，签名逐字照抄 02-design.md。改完立即跑 dsh-plugin-dev check --strict。'
                    - name: reviewer
                      role: '评审：对照 01-interview.md 与 02-design.md 的签名逐条核验，只读不改；发现问题打回修复。'
          # dsh-plugin-guide (community plugin, PerryLink/dsh-plugin-guide,
          # published on npm as `dsh-plugin-guide`):
          # provides the `cordis-plugin-development`, `editing-cordis-
          # compositions`, and `cordis-composition-reference` skills that
          # stages 2 (Design) and 4 (Generate) explicitly read for the
          # bundle shape and contract reference. Without it, the model
          # falls back to guessing Cordis conventions.
          - id: plugin-guide
            name: dsh-plugin-guide
          # tool-bash: the official shell execution tool. As of DSH 0.1.7+
          # this single bundle handles bash, PowerShell, and cmd.exe
          # through a unified `dsh-shell` service (the shell is chosen
          # per-platform from `dsh-shell-env`). Stages 4 (Generate) and
          # 5 (Verify) MUST run commands — pnpm install, pnpm run
          # typecheck, pnpm test, pnpm pack, dsh-plugin-dev check
          # --strict, dsh-plugin-dev verify. Without this entry the
          # model can only describe what to type; it cannot actually
          # execute anything.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'