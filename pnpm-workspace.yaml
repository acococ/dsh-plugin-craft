# ============================================================================
# pnpm-workspace.yaml —— pnpm 构建脚本白名单
# ----------------------------------------------------------------------------
# 作用：允许指定依赖包执行它的安装期（生命周期）脚本。
#
# pnpm 11 改了默认行为：依赖包的 postinstall 这类脚本，默认一律不跑。
# 而 esbuild（被 tsdown 间接依赖）在 postinstall 里会去下载对应平台的
# 二进制文件 —— 不放行的话，构建会直接报「找不到二进制」，
# 而且这个报错跟权限毫无关系，很容易排查半天。
#
# 另外：这个文件同时也是「工作区根」的声明文件，
# 正是靠它，profile 那边的 pnpm-workspace.yaml 才能把这个 bundle
# 拉进本地 store。
# ============================================================================

# allowBuilds：允许执行安装脚本的依赖名单。
allowBuilds:
  # esbuild：放行。没有这一行 tsdown 就构建不起来。
  esbuild: true
